[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alienape-agent"
license = "0BSD"
version = "0.7.0"
description = "Local desktop AI controller with controlled workspace tools"
requires-python = ">=3.12"
dependencies = ["PyQt6==6.8.1", "PyQt6-Qt6==6.8.2", "httpx>=0.27,<1", "tomli-w>=1.0,<2", "jsonschema>=4.22,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["pyinstaller==6.22.3"]

[project.gui-scripts]
alienape = "alienape.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"alienape.i18n" = ["*.json"]
